# leave empty if u dont wanna have a base
base="static/"

dirs {
    html="html/"
    css="css/"
    js="js/"
    img="img/"
}

routes {
    html {
        # nothing before = means empty url basically index.html
        ="index.html"

        # /: means its a 404
        /:="defaults/404.html"

        #normal routes
        about="about.html"

    }
    css {
        index.css="index.css"
    }
    js {

    }
    img {
        favicon.ico="favicon.ico"
    }
}

MIME {
    .html="text/html"
    .css= "text/css"
    .js=  "application/javascript"
    .png= "image/png"
    .ico= "image/x-icon"
}