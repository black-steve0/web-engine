# toggles
# emplement --root on every page, if true wont do anything if the file is empty
force-root=true

dirs="static/" {
    html="html/"
    css="css/"
    js="js/"
    img="img/"
}

defaults="defaults/" {
    root="title.html"
}

routes {
    html="html/" {
        # = means empty url basically index.html
        ="index.html" {--root, defualt}

        #normal routes
        about="about.html" {--root}
        404="about.html"
    }
    css="css/" {
        index.css="index.css"
    }
    js="js/" {

    }
    img="img/" {
        favicon.ico="favicon.ico"
    }
    errors="errors/" {
        404="404.html"
        _="error.html"
    }
}

api {
    GET="GET/" {
        users = "python get_users.py"
    }
    POST="GET/" {
        posts = "python get_users.py"
    }
}

MIME {
    html="text/html"
    css= "text/css"
    js=  "application/javascript"
    png= "image/png"
    ico= "image/x-icon"
}
